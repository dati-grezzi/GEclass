<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>GEclass · Gestionale Classe</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23F3F0E7%22%20stroke%3D%22%23DDD8C9%22%20stroke-width%3D%222%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2253%22%20font-family%3D%22Georgia%2Cserif%22%20font-weight%3D%22700%22%20font-size%3D%2237%22%20fill%3D%22%23C0403A%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%20letter-spacing%3D%22-1%22%3EGE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F3F0E7;
      --paper2: #FBFAF5;
      --ink: #232B39;
      --ink-soft: #6A7180;
      --red: #C0403A;
      --teal: #1C6E6A;
      --amber: #B07A1E;
      --rule: #DED8C6;
      --rule-soft: #E9E4D6;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding-bottom: 78px;
      max-width: 640px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 18px 18px 12px;
      border-bottom: 2px solid var(--ink);
      position: sticky;
      top: 0;
      background: var(--paper);
      z-index: 100;
    }
    .wordmark {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: -0.01em;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 0;
    }
    .wordmark .brand {
      position: relative;
      display: inline-block;
      padding-bottom: 4px;
      border-bottom: 3px solid var(--teal);
    }
    .wordmark .sos {
      color: var(--red);
    }
    .wordmark .pencil {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      margin-left: -2px;
    }
    .tagline {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 3px;
      font-weight: 500;
    }
    main {
      padding: 16px 14px;
    }
    h2.sec {
      font-family: 'Zilla Slab', serif;
      font-weight: 600;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      margin: 4px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2.sec::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    h3 {
      font-family: 'Zilla Slab', serif;
      font-weight: 600;
      font-size: 15px;
      margin: 16px 0 10px;
      color: var(--ink);
    }
    nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    nav button {
      flex: 1;
      min-width: 100px;
      text-align: center;
      padding: 9px 10px;
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      background: var(--paper2);
      font-weight: 700;
      font-size: 13px;
      color: var(--ink-soft);
      cursor: pointer;
      font-family: 'Zilla Slab', serif;
      transition: 0.12s;
    }
    nav button.on {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      background: var(--paper2);
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      font-weight: 500;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: var(--teal);
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      background: var(--teal);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.12s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn.ghost {
      background: transparent;
      color: var(--teal);
      border: 1.5px solid var(--teal);
    }
    .btn-mini {
      padding: 8px 11px;
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      background: var(--paper2);
      color: var(--ink-soft);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: 0.12s;
    }
    .btn-mini.on {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }
    .btn-mini.danger {
      background: #F4DAD7;
      color: var(--red);
      border-color: #E3B7B2;
    }
    .answer {
      background: var(--paper2);
      border: 1.5px solid var(--rule);
      border-left: 4px solid var(--teal);
      border-radius: 12px;
      padding: 16px;
      margin-top: 6px;
    }
    .answer .big {
      font-family: 'Zilla Slab', serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }
    .answer .sub {
      font-size: 14px;
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .card {
      background: var(--paper2);
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 15px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #E4E9F1;
      color: #2A3F5F;
      font-size: 13px;
      font-weight: 600;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .chip.bes {
      background: #FFE5CC;
      color: #8B5A00;
    }
    .chip.bassa {
      background: #FFE5CC;
      color: #8B5A00;
    }
    .chip.media {
      background: #E8E8E8;
      color: #555;
    }
    .chip.alta {
      background: #D4EDDA;
      color: #155724;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }
    .row-label {
      min-width: 50px;
      font-weight: 600;
      color: var(--ink-soft);
    }
    .row-content {
      flex: 1;
      min-width: 0;
    }
    .hint {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 6px;
      font-style: italic;
    }
    .flag {
      background: #F4DAD7;
      border: 1px solid #E3B7B2;
      border-radius: 9px;
      padding: 10px 12px;
      margin-top: 6px;
      font-size: 13.5px;
      color: #8A2F2A;
    }
    .empty {
      text-align: center;
      padding: 38px 20px;
      color: var(--ink-soft);
    }
    .empty .ic {
      font-family: 'Zilla Slab', serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }
    .student-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--rule-soft);
      border-radius: 8px;
      background: var(--paper2);
      margin-bottom: 8px;
    }
    .student-id {
      min-width: 50px;
      font-weight: 700;
      font-size: 16px;
      font-family: 'Zilla Slab', serif;
      color: var(--ink);
    }
    .student-info {
      flex: 1;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .student-actions {
      display: flex;
      gap: 6px;
    }
    .toggle-btn {
      padding: 6px 10px;
      border: 1.5px solid var(--rule);
      border-radius: 8px;
      background: var(--paper2);
      color: var(--ink-soft);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: 0.12s;
      white-space: nowrap;
    }
    .toggle-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }
    .rm-btn {
      padding: 6px 10px;
      border: 1.5px solid #E3B7B2;
      border-radius: 8px;
      background: #F4DAD7;
      color: var(--red);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .ins-btn {
      width: 100%;
      padding: 8px;
      border: 1.5px dashed var(--rule);
      border-radius: 9px;
      background: transparent;
      color: var(--teal);
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .ins-btn.ins-inline {
      opacity: 0.55;
      margin: 4px 0 10px;
      font-size: 11.5px;
      padding: 5px;
    }
    .ins-btn.ins-inline:hover {
      opacity: 1;
      border-color: var(--teal);
    }
    .group-box {
      background: var(--paper2);
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .group-title {
      font-family: 'Zilla Slab', serif;
      font-weight: 600;
      font-size: 14px;
      color: var(--teal);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule-soft);
    }
    .group-member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 15px;
      border-bottom: 1px solid var(--rule-soft);
    }
    .group-member:last-child {
      border-bottom: none;
    }
    .member-id {
      font-weight: 700;
      min-width: 40px;
    }
    .member-level {
      font-size: 12px;
      color: var(--ink-soft);
      padding: 3px 8px;
      background: var(--paper);
      border-radius: 6px;
      min-width: 50px;
      text-align: center;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-top: 1px solid var(--rule-soft);
      font-size: 14.5px;
    }
    .stats b {
      font-weight: 700;
    }

    /* REGISTRO */
    .reg-student {
      background: var(--paper2);
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .reg-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .reg-id {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
    }
    .reg-disc {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }
    .reg-disc + .reg-disc {
      border-top: 1px solid var(--rule-soft);
    }
    .reg-disc-label {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--ink-soft);
      min-width: 38px;
      letter-spacing: 0.03em;
    }
    .reg-checks {
      display: flex;
      gap: 8px;
      flex: 1;
    }
    .reg-check {
      position: relative;
      flex: 1;
      min-height: 44px;
      border: 1.5px solid var(--rule);
      border-radius: 9px;
      background: var(--paper);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: 0.12s;
      user-select: none;
    }
    .reg-check .glyph {
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      color: var(--ink-soft);
    }
    .reg-check .cdate {
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-soft);
      line-height: 1;
    }
    .reg-check .cbadge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 9px;
      background: #C79A16;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reg-check.on {
      background: #FBEB9C;
      border-color: #E0C042;
    }
    .reg-check.on .glyph { color: #7A5E05; }
    .reg-check.on .cdate { color: #7A5E05; }
    .reg-check.nota .cbadge { background: var(--red); }
    .reg-check.nota.on {
      background: #F4DAD7;
      border-color: var(--red);
    }
    .reg-check.nota.on .glyph { color: var(--red); }
    .reg-check.nota.on .cdate { color: var(--red); }
    .reg-storico-btn {
      margin-top: 8px;
      width: 100%;
      padding: 7px;
      border: 1.5px solid var(--rule);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink-soft);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .reg-storico {
      margin-top: 8px;
      border-top: 1px solid var(--rule-soft);
      padding-top: 8px;
    }
    .reg-storico-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 5px 0;
      font-size: 13px;
    }
    .reg-storico-line .lab {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 12px;
      min-width: 78px;
      color: var(--ink-soft);
    }
    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 7px;
      background: #DCEBEA;
      color: var(--teal);
      font-size: 12px;
      font-weight: 600;
    }
    .date-pill.nota {
      background: #F4DAD7;
      color: var(--red);
    }
    .date-pill .x {
      cursor: pointer;
      font-weight: 700;
      opacity: 0.7;
    }
    .reg-legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 12px;
    }
    .reg-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .reg-dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 1.5px solid #E0BE45;
      background: #FCF3CE;
    }
    .reg-dot.nota {
      border-color: var(--red);
      background: #F4DAD7;
    }

    /* SLOT MACHINE ESTRAZIONE */
    .slot-stage {
      background: var(--ink);
      border-radius: 16px;
      padding: 22px 18px 24px;
      margin-top: 6px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(35,43,57,0.18);
    }
    .slot-progress {
      font-family: 'Zilla Slab', serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9AA3B2;
      margin-bottom: 14px;
    }
    .slot-window {
      position: relative;
      background: var(--paper);
      border-radius: 14px;
      margin: 0 auto 6px;
      max-width: 240px;
      padding: 18px 10px;
      overflow: hidden;
      border: 3px solid #3A4250;
    }
    .slot-window::before,
    .slot-window::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 32px;
      z-index: 2;
      pointer-events: none;
    }
    .slot-window::before {
      top: 0;
      background: linear-gradient(to bottom, rgba(243,240,231,0.95), rgba(243,240,231,0));
    }
    .slot-window::after {
      bottom: 0;
      background: linear-gradient(to top, rgba(243,240,231,0.95), rgba(243,240,231,0));
    }
    .slot-number {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 82px;
      line-height: 1;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .slot-number.rolling {
      color: var(--ink-soft);
      opacity: 0.85;
    }
    .slot-number.landed {
      color: var(--red);
      animation: slotPop 0.4s ease;
    }
    @keyframes slotPop {
      0% { transform: scale(0.6); opacity: 0.4; }
      60% { transform: scale(1.14); }
      100% { transform: scale(1); opacity: 1; }
    }
    .slot-avatar-wrap {
      min-height: 40px;
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: slotPop 0.4s ease;
    }
    .slot-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }
    .slot-btn {
      padding: 13px 22px;
      border-radius: 11px;
      border: none;
      background: var(--teal);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    .slot-btn.sec {
      background: transparent;
      color: var(--paper);
      border: 1.5px solid #4A5568;
    }
    .slot-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .slot-done-list {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .slot-done-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--paper);
      background: #384252;
      border-radius: 8px;
      padding: 3px 11px 3px 5px;
    }
    .sound-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--ink-soft);
      cursor: pointer;
      user-select: none;
      margin-bottom: 14px;
    }
    .sound-toggle .box {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--rule);
      border-radius: 5px;
      background: var(--paper2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--teal);
      font-weight: 700;
    }

    /* ALLA LAVAGNA */
    .lav-roundbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--ink);
      color: var(--paper);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    .lav-round-num {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 20px;
    }
    .lav-round-prog {
      font-size: 13px;
      color: #B7BEC9;
      font-weight: 600;
    }
    .lav-progress-track {
      height: 8px;
      background: var(--rule-soft);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .lav-progress-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 6px;
      transition: width 0.3s ease;
    }
    .lav-current {
      background: var(--paper2);
      border: 1.5px solid var(--teal);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
      animation: slotPop 0.35s ease;
    }
    .lav-avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }
    .lav-current-id {
      font-family: 'Zilla Slab', serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 1;
      color: var(--ink);
    }
    .lav-current-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .lav-current-meta {
      margin-top: 8px;
      min-height: 24px;
    }
    .lav-outcomes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }
    .lav-out-btn {
      padding: 14px 6px;
      border-radius: 11px;
      border: 1.5px solid transparent;
      font-family: inherit;

<body>
  <div id="app"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const STORAGE_KEY = 'gestionale-classe-data';

    const defaultData = {
      classi: {},
      extracted: {},
      registro: {},
      lavagna: {},
      created: new Date().toISOString()
    };

    // Genera un id interno stabile e univoco per ogni studente
    let uidCounter = 0;
    const genUid = () => {
      uidCounter += 1;
      return 'u' + Date.now().toString(36) + '_' + uidCounter.toString(36) +
        Math.random().toString(36).slice(2, 6);
    };

    // Migrazione: aggancia i dati a uid stabili invece che al numero di registro.
    // Se i dati sono già migrati (studenti con uid) non cambia nulla.
    const migrate = (raw) => {
      if (!raw || typeof raw !== 'object') return defaultData;
      const d = {
        classi: raw.classi || {},
        extracted: raw.extracted || {},
        registro: raw.registro || {},
        lavagna: raw.lavagna || {},
        created: raw.created || new Date().toISOString()
      };

      Object.keys(d.classi).forEach(classId => {
        const cls = d.classi[classId];
        if (!cls.students) cls.students = [];

        // Serve migrazione se qualche studente non ha uid
        const needs = cls.students.some(s => !s.uid);
        if (!needs) {
          cls.size = cls.students.length;
          return;
        }

        // Mappa vecchio numero di registro -> nuovo uid, mantenendo l'ordine
        const oldToUid = {};
        cls.students.forEach(s => {
          const oldId = s.id;
          if (!s.uid) s.uid = genUid();
          if (oldId != null) oldToUid[oldId] = s.uid;
          delete s.id;
        });
        cls.size = cls.students.length;

        // extracted: array di vecchi numeri -> array di uid
        if (Array.isArray(d.extracted[classId])) {
          d.extracted[classId] = d.extracted[classId]
            .map(oldId => oldToUid[oldId])
            .filter(Boolean);
        }

        // registro: chiavi vecchio numero -> uid
        if (d.registro[classId]) {
          const newReg = {};
          Object.keys(d.registro[classId]).forEach(oldId => {
            const uid = oldToUid[oldId];
            if (uid) newReg[uid] = d.registro[classId][oldId];
          });
          d.registro[classId] = newReg;
        }

        // lavagna: doneThisRound e turns
        if (d.lavagna[classId]) {
          const lv = d.lavagna[classId];
          if (Array.isArray(lv.doneThisRound)) {
            lv.doneThisRound = lv.doneThisRound.map(oldId => oldToUid[oldId]).filter(Boolean);
          }
          if (lv.turns) {
            const newTurns = {};
            Object.keys(lv.turns).forEach(oldId => {
              const uid = oldToUid[oldId];
              if (uid) newTurns[uid] = lv.turns[oldId];
            });
            lv.turns = newTurns;
          }
        }
      });

      return d;
    };

    // Storage hooks
    const useStorage = () => {
      const [data, setData] = useState(defaultData);

      useEffect(() => {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            const migrated = migrate(JSON.parse(stored));
            setData(migrated);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          } catch (e) {
            console.error('Storage error:', e);
          }
        }
      }, []);

      const saveData = useCallback((newData) => {
        setData(newData);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
      }, []);

      return [data, saveData];
    };

    // Main App
    function App() {
      const [data, saveData] = useStorage();
      const [tab, setTab] = useState('classi');

      return (
        <>
          <header>
            <div className="wordmark">
              <span className="brand"><span className="sos">GE</span>class</span>
              <svg className="pencil" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14.06 6.19l3.75 3.75L8.5 19.25l-3.75.94.94-3.75 8.37-10.25z" fill="#232B39"/>
                <path d="M16.06 4.19l1.44-1.44a1.33 1.33 0 011.88 0l1.87 1.87a1.33 1.33 0 010 1.88l-1.44 1.44-3.75-3.75z" fill="#232B39"/>
                <path d="M5.69 16.44l1.87 1.87" stroke="#F3F0E7" stroke-width="1" stroke-linecap="round"/>
              </svg>
            </div>
            <div className="tagline">Gestionale di classe</div>
          </header>

          <main>
            <nav>
              <button 
                className={tab === 'classi' ? 'on' : ''}
                onClick={() => setTab('classi')}
              >
                Classi
              </button>
              <button 
                className={tab === 'estrazione' ? 'on' : ''}
                onClick={() => setTab('estrazione')}
              >
                Estrazione
              </button>
              <button 
                className={tab === 'gruppi' ? 'on' : ''}
                onClick={() => setTab('gruppi')}
              >
                Gruppi
              </button>
              <button 
                className={tab === 'registro' ? 'on' : ''}
                onClick={() => setTab('registro')}
              >
                Registro
              </button>
              <button 
                className={tab === 'lavagna' ? 'on' : ''}
                onClick={() => setTab('lavagna')}
              >
                Alla lavagna
              </button>
              <button 
                className={tab === 'backup' ? 'on' : ''}
                onClick={() => setTab('backup')}
              >
                Backup
              </button>
            </nav>

            {tab === 'classi' && <ClassiTab data={data} saveData={saveData} />}
            {tab === 'estrazione' && <EstrazioneTab data={data} saveData={saveData} />}
            {tab === 'gruppi' && <GruppiTab data={data} saveData={saveData} />}
            {tab === 'registro' && <RegistroTab data={data} saveData={saveData} />}
            {tab === 'lavagna' && <LavagnaTab data={data} saveData={saveData} />}
            {tab === 'backup' && <BackupTab data={data} saveData={saveData} />}
          </main>
        </>
      );
    }

    // CLASSI TAB
    function ClassiTab({ data, saveData }) {
      const [selectedClass, setSelectedClass] = useState(null);
      const [showNew, setShowNew] = useState(false);
      const [newClassName, setNewClassName] = useState('');
      const [newClassSize, setNewClassSize] = useState('20');

      const addClass = () => {
        if (!newClassName.trim() || !newClassSize) return;
        const classId = Date.now().toString();
        const n = parseInt(newClassSize);
        const newData = {
          ...data,
          classi: {
            ...data.classi,
            [classId]: {
              id: classId,
              nome: newClassName,
              size: n,
              students: Array.from({ length: n }, () => ({
                uid: genUid(),
                bes: false,
                livello: 'Media'
              })),
              createdAt: new Date().toISOString()
            }
          }
        };
        saveData(newData);
        setNewClassName('');
        setNewClassSize('20');
        setShowNew(false);
        setSelectedClass(classId);
      };

      const deleteClass = (classId) => {
        const newData = { ...data };
        delete newData.classi[classId];
        saveData(newData);
        setSelectedClass(null);
      };

      const updateStudent = (classId, uid, updates) => {
        const newData = { ...data };
        const student = newData.classi[classId].students.find(s => s.uid === uid);
        if (student) {
          Object.assign(student, updates);
        }
        saveData(newData);
      };

      // Inserisce un nuovo studente alla posizione indicata (0 = in cima).
      // Tutti gli altri scalano il numero di registro, ma mantengono i loro dati (agganciati all'uid).
      const insertStudent = (classId, position) => {
        const newData = { ...data };
        const cls = newData.classi[classId];
        const nuovo = { uid: genUid(), bes: false, livello: 'Media' };
        cls.students.splice(position, 0, nuovo);
        cls.size = cls.students.length;
        saveData(newData);
      };

      // Rimuove uno studente. Gli altri scalano, i loro dati restano intatti.
      const removeStudent = (classId, uid) => {
        const newData = { ...data };
        const cls = newData.classi[classId];
        cls.students = cls.students.filter(s => s.uid !== uid);
        cls.size = cls.students.length;
        // Pulisco i dati collegati a questo studente
        if (newData.extracted[classId]) {
          newData.extracted[classId] = newData.extracted[classId].filter(id => id !== uid);
        }
        if (newData.registro[classId]) {
          delete newData.registro[classId][uid];
        }
        if (newData.lavagna[classId]) {
          const lv = newData.lavagna[classId];
          if (lv.doneThisRound) lv.doneThisRound = lv.doneThisRound.filter(id => id !== uid);
          if (lv.turns) delete lv.turns[uid];
        }
        saveData(newData);
      };

      const classiList = Object.values(data.classi);

      if (classiList.length === 0 && !showNew) {
        return (
          <>
            <h2 className="sec">Classi</h2>
            <div className="empty">
              <div className="ic">📚</div>
              <p>Nessuna classe ancora. Creane una per iniziare.</p>
            </div>
            <button className="btn" onClick={() => setShowNew(true)} style={{ width: '100%' }}>
              Aggiungi prima classe
            </button>
          </>
        );
      }

      return (
        <>
          <h2 className="sec">Classi</h2>

          {showNew && (
            <div className="answer">
              <div className="field">
                <label>Nome classe</label>
                <input 
                  type="text" 
                  placeholder="es. 1A"
                  value={newClassName}
                  onChange={(e) => setNewClassName(e.target.value)}
                />
              </div>
              <div className="field">
                <label>Numero studenti</label>
                <input 
                  type="number" 
                  value={newClassSize}
                  onChange={(e) => setNewClassSize(e.target.value)}
                />
              </div>
              <div style={{ display: 'flex', gap: '10px' }}>
                <button className="btn" onClick={addClass}>Crea</button>
                <button className="btn ghost" onClick={() => setShowNew(false)}>Annulla</button>
              </div>
            </div>
          )}

          {!showNew && (
            <button className="btn" onClick={() => setShowNew(true)} style={{ width: '100%', marginBottom: '14px' }}>
              + Aggiungi classe
            </button>
          )}

          {classiList.map(cls => (
            <div key={cls.id} className="card">
              <div className="card-header">
                <div>
                  <div style={{ fontSize: '16px', fontWeight: '700' }}>{cls.nome}</div>
                  <div style={{ fontSize: '12px', color: 'var(--ink-soft)' }}>{cls.size} studenti</div>
                </div>
                <button 
                  className="btn-mini danger"
                  onClick={() => deleteClass(cls.id)}
                >
                  Elimina
                </button>
              </div>

              <div style={{ marginBottom: '10px' }}>
                <button 
                  className={selectedClass === cls.id ? 'btn-mini on' : 'btn-mini'}
                  onClick={() => setSelectedClass(selectedClass === cls.id ? null : cls.id)}
                >
                  {selectedClass === cls.id ? '▼ Richiudi' : '▶ Modifica'}
                </button>
              </div>

              {selectedClass === cls.id && (
                <ClassStudentList 
                  classData={cls} 
                  onUpdateStudent={updateStudent}
                  onInsertStudent={insertStudent}
                  onRemoveStudent={removeStudent}
                />
              )}
            </div>
          ))}
        </>
      );
    }

    function ClassStudentList({ classData, onUpdateStudent, onInsertStudent, onRemoveStudent }) {
      const confirmRemove = (uid, num) => {
        if (window.confirm('Togliere lo studente n° ' + num + '? I numeri successivi scalano; i loro dati restano. I dati di questo studente vengono eliminati.')) {
          onRemoveStudent(classData.id, uid);
        }
      };

      return (
        <div style={{ borderTop: '1px solid var(--rule)', paddingTop: '12px' }}>
          <h3 style={{ margin: '0 0 4px' }}>Studenti</h3>
          <p className="hint" style={{ marginTop: 0 }}>
            Il numero è la posizione in elenco. Inserisci o togli uno studente: gli altri scalano da soli senza perdere i dati.
          </p>

          <button
            className="ins-btn"
            onClick={() => onInsertStudent(classData.id, 0)}
          >
            ＋ Inserisci in cima
          </button>

          {classData.students.map((student, idx) => (
            <div key={student.uid}>
              <div className="student-row">
                <Avatar uid={student.uid} size={32} />
                <div className="student-id">{idx + 1}</div>
                <div className="student-info">
                  <select 
                    value={student.livello}
                    onChange={(e) => onUpdateStudent(classData.id, student.uid, { livello: e.target.value })}
                    style={{ padding: '6px 8px', fontSize: '13px', minWidth: '90px' }}
                  >
                    <option value="Bassa">Bassa</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                  </select>
                </div>
                <div className="student-actions">
                  <button
                    className={`toggle-btn ${student.bes ? 'active' : ''}`}
                    onClick={() => onUpdateStudent(classData.id, student.uid, { bes: !student.bes })}
                  >
                    {student.bes ? '✓ BES' : 'BES'}
                  </button>
                  <button
                    className="rm-btn"
                    onClick={() => confirmRemove(student.uid, idx + 1)}
                    title="Togli studente"
                  >
                    ✕
                  </button>
                </div>
              </div>
              <button
                className="ins-btn ins-inline"
                onClick={() => onInsertStudent(classData.id, idx + 1)}
              >
                ＋ Inserisci sotto il n° {idx + 1}
              </button>
            </div>
          ))}
        </div>
      );
    }

    // ESTRAZIONE TAB
    function EstrazioneTab({ data, saveData }) {
      const [selectedClass, setSelectedClass] = useState(null);
      const [count, setCount] = useState('1');
      const [sound, setSound] = useState(true);

      // Stato animazione: 'idle' | 'rolling' | 'revealed'
      const [phase, setPhase] = useState('idle');
      const [queue, setQueue] = useState([]);      // id da rivelare in ordine
      const [current, setCurrent] = useState(0);   // indice corrente nella queue
      const [display, setDisplay] = useState('?'); // numero mostrato nella slot

      const timerRef = useRef(null);
      const audioRef = useRef(null);

      const classi = Object.values(data.classi);
      const cls = classi.find(c => c.id === selectedClass);

      // --- AUDIO (sintetizzato, nessun file esterno) ---
      const getCtx = () => {
        if (!audioRef.current) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioRef.current = new AC();
        }
        return audioRef.current;
      };
      const playTick = () => {
        if (!sound) return;
        const ctx = getCtx();
        if (!ctx) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'square';
        o.frequency.value = 850 + Math.random() * 250;
        g.gain.setValueAtTime(0.05, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + 0.05);
      };
      const playDing = () => {
        if (!sound) return;
        const ctx = getCtx();
        if (!ctx) return;
        [880, 1320].forEach((f) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.value = f;
          const t = ctx.currentTime;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t + 0.55);
        });
      };

      // Pulizia timer
      useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

      // --- ROLL slot machine verso un target (uid) ---
      const rollTo = (targetUid) => {
        const allNums = cls.students.map((s, i) => i + 1);
        const targetNum = cls.students.findIndex(s => s.uid === targetUid) + 1;
        setPhase('rolling');
        let delay = 45;
        const step = () => {
          const rnd = allNums[Math.floor(Math.random() * allNums.length)];
          setDisplay(rnd);
          playTick();
          delay *= 1.13;
          if (delay < 300) {
            timerRef.current = setTimeout(step, delay);
          } else {
            setDisplay(targetNum);
            playDing();
            if (navigator.vibrate) navigator.vibrate(60);
            setPhase('revealed');
          }
        };
        step();
      };

      const startExtraction = () => {
        if (!selectedClass || !cls) return;
        const n = parseInt(count);
        if (!n || n < 1) return;

        const extracted_ids = data.extracted[selectedClass] || [];
        const available = cls.students.filter(s => !s.bes && !extracted_ids.includes(s.uid));

        if (available.length < n) {
          alert('Solo ' + available.length + ' studenti disponibili (BES esonerati, già estratti esclusi)');
          return;
        }

        const shuffled = [...available].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, n).map(s => s.uid);

        // Registra subito gli estratti
        const newData = {
          ...data,
          extracted: {
            ...data.extracted,
            [selectedClass]: [...extracted_ids, ...selected]
          }
        };
        saveData(newData);

        // Sblocca l'audio (gesto utente)
        const ctx = getCtx();
        if (ctx && ctx.state === 'suspended') ctx.resume();

        setQueue(selected);
        setCurrent(0);
        rollTo(selected[0]);
      };

      const nextReveal = () => {
        const ctx = getCtx();
        if (ctx && ctx.state === 'suspended') ctx.resume();
        const nextIdx = current + 1;
        setCurrent(nextIdx);
        rollTo(queue[nextIdx]);

        setPhase('idle');
        setQueue([]);
        setCurrent(0);
        setDisplay('?');

        const newData = { ...data, extracted: { ...data.extracted, [selectedClass]: [] } };
        saveData(newData);
      };

      const currentStudent = cls && queue.length > 0
        ? cls.students.find(s => s.uid === queue[current])
        : null;

      const totalExtracted = cls ? (data.extracted[selectedClass] || []).length : 0;
      const remaining = cls
        ? cls.students.filter(s => !s.bes && !(data.extracted[selectedClass] || []).includes(s.uid)).length
        : 0;

      const inAnimation = phase !== 'idle';

      return (
        <>

          <p className="hint">Slot machine per le interrogazioni. Gli studenti BES sono esonerati e chi è già stato estratto non riesce di nuovo.</p>

                      {classi.map(c => (
                        <option key={c.id} value={c.id}>{c.nome} ({c.size} studenti)</option>
                      ))}
                    </select>
                  </div>

                    <>
                      <div className="field">

                        <input 
                          type="number" 
                          value={count}
                          onChange={(e) => setCount(e.target.value)}

                          max={remaining}
                        />
                      </div>

                      <label className="sound-toggle" onClick={() => setSound(!sound)}>
                        <span className="box">{sound ? '♪' : ''}</span>

                      </label>

                      <button className="btn" onClick={startExtraction} style={{ width: '100%', marginBottom: '14px' }}>
                        🎲 Estrai
                      </button>

                      <div className="answer">
                        <div className="big">{remaining} sorteggiabili</div>
                        <div className="sub">Già estratti: {totalExtracted}</div>
                      </div>

                      {totalExtracted > 0 && (
                        <button className="btn ghost" onClick={resetExtracted} style={{ width: '100%', marginTop: '12px' }}>
                          Azzera estratti
                        </button>
                      )}
                    </>
                  )}
                </>
              )}

              {inAnimation && (
                <div className="slot-stage">
                  <div className="slot-progress">
                    Estrazione {current + 1} di {queue.length}
                  </div>

                  <div className="slot-window">
                    <div className={'slot-number ' + (phase === 'rolling' ? 'rolling' : 'landed')}>
                      {display}
                    </div>
                  </div>

                  {phase === 'revealed' && currentStudent && (
                    <div className="slot-avatar-wrap">
                      <AvatarFull uid={currentStudent.uid} size={92} />
                    </div>
                  )}

                  <div className="slot-actions">
                    {phase === 'rolling' && (
                      <button className="slot-btn" disabled>Estrazione…</button>
                    )}
                    {phase === 'revealed' && current < queue.length - 1 && (
                      <button className="slot-btn" onClick={nextReveal}>Prossimo →</button>
                    )}
                    {phase === 'revealed' && current >= queue.length - 1 && (
                      <button className="slot-btn" onClick={finish}>Fine ✓</button>

                    <div className="slot-done-list">

                            {num}
                          </span>

                    </div>

                </div>

            </>

    // --- AVATAR: pupazzetto robot/mostriciattolo generato dall'uid, sempre uguale ---
    const hashStr = (str) => {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    };

    const mulberry32 = (seed) => {
      let s = seed;
      return () => {
        s |= 0; s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    };

      doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
      doc.text('Classe ' + cls.nome + '   \u00b7   giro ' + round + '   \u00b7   generato il ' + fmtFull(new Date()), 14, 22);

      const turns = (lavForClass && lavForClass.turns) || {};
      const head = [['N\u00b0', 'Turni', 'Dettaglio (data \u00b7 esito)']];
      const body = cls.students.map((s, i) => {
        const t = turns[s.uid] || [];
        const detail = t.map(x => fmtDate(x.date) + ' ' + (OUTCOME_WORD[x.outcome] || '')).join('    ');
        return [String(i + 1), String(t.length), detail];
      });

      doc.autoTable({
        head: head, body: body, startY: 27,
        styles: { fontSize: 9, cellPadding: 2.5, valign: 'middle', lineColor: [222, 216, 198], lineWidth: 0.1 },
        headStyles: { fillColor: [35, 43, 57], textColor: [243, 240, 231], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [251, 250, 245] },
        columnStyles: {
          0: { cellWidth: 14, halign: 'center', fontStyle: 'bold' },
          1: { cellWidth: 16, halign: 'center' }
        }
      });
      doc.save('GEclass-lavagna-' + cls.nome + '.pdf');
    };

    function RegistroTab({ data, saveData }) {
      const [selectedClass, setSelectedClass] = useState(null);
      const [openStorico, setOpenStorico] = useState({});

      const classi = Object.values(data.classi);
      const cls = classi.find(c => c.id === selectedClass);
      const registro = data.registro || {};

      const getStudentReg = (studentId) => {
        const classReg = registro[selectedClass] || {};
        return classReg[studentId] || {};
      };

      const getSlot = (studentId, disc, slot) => {
        const sr = getStudentReg(studentId);
        return (sr[disc] && sr[disc][slot]) ? sr[disc][slot] : [];
      };

      // Toggle: aggiunge oggi se assente, rimuove oggi se già presente
      const toggleToday = (studentId, disc, slot) => {
        const today = todayISO();
        const newData = { ...data };
        if (!newData.registro) newData.registro = {};
        if (!newData.registro[selectedClass]) newData.registro[selectedClass] = {};
        if (!newData.registro[selectedClass][studentId]) newData.registro[selectedClass][studentId] = {};
        if (!newData.registro[selectedClass][studentId][disc]) newData.registro[selectedClass][studentId][disc] = {};
        const arr = newData.registro[selectedClass][studentId][disc][slot] || [];
        const idx = arr.indexOf(today);
        if (idx >= 0) {
          arr.splice(idx, 1);
        } else {
          arr.push(today);
          arr.sort();
        }
        newData.registro[selectedClass][studentId][disc][slot] = arr;
        saveData(newData);
      };

      const removeDate = (studentId, disc, slot, iso) => {
        const newData = { ...data };
        const arr = newData.registro[selectedClass][studentId][disc][slot];
        const idx = arr.indexOf(iso);
        if (idx >= 0) arr.splice(idx, 1);
        saveData(newData);
      };

      const isTodayOn = (studentId, disc, slot) => {
        return getSlot(studentId, disc, slot).includes(todayISO());
      };

      const toggleStorico = (studentId) => {
        setOpenStorico(prev => ({ ...prev, [studentId]: !prev[studentId] }));
      };

      const hasAnyDates = (studentId) => {
        return DISCIPLINE.some(disc =>
          SLOTS.some(slot => getSlot(studentId, disc, slot).length > 0)
        );
      };

      return (
        <>
          <h2 className="sec">Registro</h2>
          <p className="hint">Tocca un check per segnare oggi. Toccalo di nuovo per togliere. Il terzo check (rosso) è la nota.</p>

          {classi.length === 0 ? (
            <div className="empty">
              <p>Crea una classe prima</p>
            </div>
          ) : (
            <>
              <div className="field">
                <label>Seleziona classe</label>
                <select 
                  value={selectedClass || ''}
                  onChange={(e) => {
                    setSelectedClass(e.target.value);
                    setOpenStorico({});
                  }}
                >
                  <option value="">— scegli —</option>
                  {classi.map(c => (
                    <option key={c.id} value={c.id}>{c.nome} ({c.size} studenti)</option>
                  ))}
                </select>
              </div>

              {selectedClass && cls && (
                <>
                  <div className="reg-legend">
                    <span><span className="reg-dot"></span> Check 1 · 2 (materiale/compiti)</span>
                    <span><span className="reg-dot nota"></span> Nota sul registro</span>
                  </div>

                  <button
                    className="btn ghost"
                    onClick={() => exportRegistroPDF(cls, registro[selectedClass] || {})}
                    style={{ width: '100%', marginBottom: '16px' }}
                  >
                    ↓ Esporta registro in PDF
                  </button>

                  {cls.students.map((student, idx) => (
                    <div key={student.uid} className="reg-student">
                      <div className="reg-head">
                        <Avatar uid={student.uid} size={28} />
                        <span className="reg-id">{idx + 1}</span>
                      </div>

                      {DISCIPLINE.map(disc => (
                        <div key={disc} className="reg-disc">
                          <span className="reg-disc-label">{DISC_LABEL[disc]}</span>
                          <div className="reg-checks">
                            {SLOTS.map(slot => {
                              const dates = getSlot(student.uid, disc, slot);
                              const on = isTodayOn(student.uid, disc, slot);
                              const isNota = slot === 'nota';
                              const lastDate = dates.length > 0 ? fmtDate(dates[dates.length - 1]) : null;
                              return (
                                <div
                                  key={slot}
                                  className={`reg-check ${isNota ? 'nota' : ''} ${on ? 'on' : ''}`}
                                  onClick={() => toggleToday(student.uid, disc, slot)}
                                >
                                  <span className="glyph">{isNota ? '!' : (dates.length > 0 ? '✓' : '·')}</span>
                                  {lastDate && <span className="cdate">{lastDate}</span>}
                                  {dates.length > 1 && <span className="cbadge">{dates.length}</span>}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ))}

                      {hasAnyDates(student.uid) && (
                        <>
                          <button 
                            className="reg-storico-btn"
                            onClick={() => toggleStorico(student.uid)}
                          >
                            {openStorico[student.uid] ? '▲ Nascondi storico' : '▼ Storico date'}
                          </button>

                          {openStorico[student.uid] && (
                            <div className="reg-storico">
                              {DISCIPLINE.map(disc =>
                                SLOTS.map(slot => {
                                  const dates = getSlot(student.uid, disc, slot);
                                  if (dates.length === 0) return null;
                                  const isNota = slot === 'nota';
                                  return (
                                    <div key={disc + slot} className="reg-storico-line">
                                      <span className="lab">{DISC_LABEL[disc]} · {SLOT_LABEL[slot]}</span>
                                      {dates.map(iso => (
                                        <span key={iso} className={`date-pill ${isNota ? 'nota' : ''}`}>
                                          {fmtDate(iso)}
                                          <span 
                                            className="x"
                                            onClick={() => removeDate(student.uid, disc, slot, iso)}
                                          >×</span>
                                        </span>
                                      ))}
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  ))}
                </>
              )}
            </>
          )}
        </>
      );
    }

    // BACKUP TAB
    function BackupTab({ data, saveData }) {
      const [msg, setMsg] = useState(null);

      const numClassi = Object.keys(data.classi || {}).length;
      const numStudenti = Object.values(data.classi || {}).reduce((sum, c) => sum + (c.students ? c.students.length : 0), 0);

      const exportData = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const d = new Date();
        const stamp = d.getFullYear() +
          String(d.getMonth() + 1).padStart(2, '0') +
          String(d.getDate()).padStart(2, '0');
        const a = document.createElement('a');
        a.href = url;
        a.download = 'geclass-backup-' + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setMsg({ ok: true, text: 'Backup esportato correttamente' });
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed || typeof parsed !== 'object' || !('classi' in parsed)) {
              setMsg({ ok: false, text: 'File non valido: non è un backup di GEclass' });
              return;
            }
            const nc = Object.keys(parsed.classi || {}).length;
            if (!window.confirm('Importare ' + nc + ' classe/i? I dati attuali su questo dispositivo verranno sostituiti.')) {
              return;
            }
            const merged = migrate(parsed);
            saveData(merged);
            setMsg({ ok: true, text: 'Dati importati correttamente' });
          } catch (err) {
            setMsg({ ok: false, text: 'Errore nella lettura del file' });
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <>
          <h2 className="sec">Backup</h2>
          <p className="hint">Sposta i tuoi dati tra telefono, tablet e PC. Esporta un file dal dispositivo con i dati aggiornati, poi importalo sull'altro.</p>

          <div className="answer" style={{ marginBottom: '16px' }}>
            <div className="big">{numClassi} classi · {numStudenti} studenti</div>
            <div className="sub">Dati salvati su questo dispositivo</div>
          </div>

          <h3>Esporta</h3>
          <p className="hint" style={{ marginTop: 0 }}>Scarica un file con tutti i dati (classi, livelli, BES, registro, estrazioni).</p>
          <button className="btn" onClick={exportData} style={{ width: '100%', marginBottom: '18px' }}>
            ↓ Esporta backup
          </button>

          <h3>Importa</h3>
          <p className="hint" style={{ marginTop: 0 }}>Carica un file di backup. Attenzione: sostituisce i dati presenti su questo dispositivo.</p>
          <input
            type="file"
            accept="application/json,.json"
            onChange={importData}
            id="importFileInput"
            style={{ display: 'none' }}
          />
          <label htmlFor="importFileInput" className="btn ghost" style={{ display: 'block', width: '100%', textAlign: 'center', cursor: 'pointer', boxSizing: 'border-box' }}>
            ↑ Importa backup
          </label>

          {msg && (
            <div className={msg.ok ? 'answer' : 'flag'} style={{ marginTop: '16px' }}>
              {msg.ok ? '✓ ' : '✗ '}{msg.text}
            </div>
          )}

          <p className="hint" style={{ marginTop: '20px' }}>
            Consiglio: dopo una lezione, esporta dal dispositivo che hai usato. Prima di lavorare su un altro dispositivo, importa l'ultimo file. Così hai sempre i dati aggiornati.
          </p>
        </>
      );
    }

    // ALLA LAVAGNA TAB
    const OUTCOME_LABEL = { plus: 'Bene', mid: 'Così così', minus: 'Male', refused: 'Rifiuto', assente: 'Assente' };
    const OUTCOME_GLYPH = { plus: '+', mid: '~', minus: '–', refused: '✕', assente: 'A' };

    function LavagnaTab({ data, saveData }) {
      const [selectedClass, setSelectedClass] = useState(null);
      const [currentId, setCurrentId] = useState(null);
      const [showOutcomes, setShowOutcomes] = useState(false);
      const [showHist, setShowHist] = useState(false);

      const classi = Object.values(data.classi);
      const cls = classi.find(c => c.id === selectedClass);
      const lavagna = data.lavagna || {};

      // seleziona uno studente senza mostrare subito gli esiti
      const selectStudent = (uid) => {
        setCurrentId(uid);
        setShowOutcomes(false);
      };

      const getClassLav = () => {
        return lavagna[selectedClass] || { round: 1, doneThisRound: [], turns: {} };
      };

      const clav = getClassLav();
      const total = cls ? cls.students.length : 0;
      const done = clav.doneThisRound || [];

      // vero se l'ultima annotazione di oggi per questo studente è "assente"
      const isAbsentToday = (uid) => {
        const turns = (clav.turns && clav.turns[uid]) || [];
        const today = todayISO();
        for (let i = turns.length - 1; i >= 0; i--) {
          if (turns[i].date === today) return turns[i].outcome === 'assente';
        }
        return false;
      };

      const pending = cls ? cls.students.filter(s => !done.includes(s.uid) && !isAbsentToday(s.uid)) : [];
      const absentToday = cls ? cls.students.filter(s => !done.includes(s.uid) && isAbsentToday(s.uid)) : [];
      const roundComplete = cls && total > 0 && done.length >= total;

      const ensureLav = (nd) => {
        if (!nd.lavagna) nd.lavagna = {};
        if (!nd.lavagna[selectedClass]) {
          nd.lavagna[selectedClass] = { round: 1, doneThisRound: [], turns: {} };
        }
        return nd.lavagna[selectedClass];
      };

      const recordOutcome = (outcome) => {
        if (!currentId) return;
        const newData = { ...data };
        const cl = ensureLav(newData);
        if (!cl.turns[currentId]) cl.turns[currentId] = [];
        cl.turns[currentId].push({
          date: todayISO(),
          outcome: outcome,
          round: cl.round
        });
        if (!cl.doneThisRound.includes(currentId)) {
          cl.doneThisRound.push(currentId);
        }
        saveData(newData);
        setCurrentId(null);
        setShowOutcomes(false);
      };

      // segna assente: registra la data ma NON conta come turno del giro,
      // così lo studente dovrà comunque passare quando sarà presente
      const markAbsent = () => {
        if (!currentId) return;
        const newData = { ...data };
        const cl = ensureLav(newData);
        if (!cl.turns[currentId]) cl.turns[currentId] = [];
        cl.turns[currentId].push({
          date: todayISO(),
          outcome: 'assente',
          round: cl.round
        });
        saveData(newData);
        setCurrentId(null);
        setShowOutcomes(false);
      };

      // annulla l'assenza segnata oggi per errore
      const undoAbsence = (uid) => {
        const newData = { ...data };
        const cl = ensureLav(newData);
        const turns = cl.turns[uid] || [];
        for (let i = turns.length - 1; i >= 0; i--) {
          if (turns[i].date === todayISO() && turns[i].outcome === 'assente') {
            turns.splice(i, 1);
            break;
          }
        }
        saveData(newData);
      };

      const pickRandom = () => {
        if (pending.length === 0) return;
        const pick = pending[Math.floor(Math.random() * pending.length)];
        setCurrentId(pick.uid);
        setShowOutcomes(false);
        if (navigator.vibrate) navigator.vibrate(40);
      };

      const startNextRound = () => {
        const newData = { ...data };
        const cl = ensureLav(newData);
        cl.round = (cl.round || 1) + 1;
        cl.doneThisRound = [];
        saveData(newData);
        setCurrentId(null);
      };

      const resetLavagna = () => {
        if (!window.confirm('Azzerare tutto il percorso alla lavagna di questa classe (giri e storico)?')) return;
        const newData = { ...data };
        if (!newData.lavagna) newData.lavagna = {};
        newData.lavagna[selectedClass] = { round: 1, doneThisRound: [], turns: {} };
        saveData(newData);
        setCurrentId(null);
      };

      const currentStudent = cls && currentId != null
        ? cls.students.find(s => s.uid === currentId) : null;
      const currentNum = currentStudent
        ? cls.students.findIndex(s => s.uid === currentStudent.uid) + 1 : null;

      // ultimo esito del giro corrente per uno studente
      const lastTurnThisRound = (studentId) => {
        const turns = (clav.turns && clav.turns[studentId]) || [];
        for (let i = turns.length - 1; i >= 0; i--) {
          if (turns[i].round === clav.round) return turns[i];
        }
        return null;
      };

      return (
        <>
          <h2 className="sec">Alla lavagna</h2>
          <p className="hint">Ogni studente fa il suo turno prima che qualcuno ci torni. Segna l'esito, il rifiuto o l'assenza: la data viene registrata. Chi è segnato assente non viene riproposto oggi, ma dovrà comunque fare il suo turno.</p>

          {classi.length === 0 ? (
            <div className="empty">
              <p>Crea una classe prima</p>
            </div>
          ) : (
            <>
              <div className="field">
                <label>Seleziona classe</label>
                <select 
                  value={selectedClass || ''}
                  onChange={(e) => {
                    setSelectedClass(e.target.value);
                    setCurrentId(null);
                    setShowHist(false);
                  }}
                >
                  <option value="">— scegli —</option>
                  {classi.map(c => (
                    <option key={c.id} value={c.id}>{c.nome} ({c.size} studenti)</option>
                  ))}
                </select>
              </div>

              {selectedClass && cls && (
                <>
                  <div className="lav-roundbar">
                    <span className="lav-round-num">Giro {clav.round}</span>
                    <span className="lav-round-prog">{done.length} / {total} fatti</span>
                  </div>
                  <div className="lav-progress-track">
                    <div className="lav-progress-fill" style={{ width: (total ? (done.length / total * 100) : 0) + '%' }}></div>
                  </div>

                  {/* Assenti oggi: esclusi dal sorteggio/scelta odierna, il turno resta da fare */}
                  {absentToday.length > 0 && (
                    <>
                      <div className="lav-section-label">Assenti oggi ({absentToday.length}) — non verranno riproposti oggi</div>
                      {absentToday.map(s => {
                        const num = cls.students.findIndex(x => x.uid === s.uid) + 1;
                        return (
                          <div key={s.uid} className="lav-done-row">
                            <Avatar uid={s.uid} size={24} />
                            <span className="lav-done-id">{num}</span>
                            <span className="out-chip assente">A Assente</span>
                            <button className="lav-undo-btn" onClick={() => undoAbsence(s.uid)}>Annulla</button>
                          </div>
                        );
                      })}
                    </>
                  )}

                  {/* Giro completato */}
                  {roundComplete && (
                    <div className="lav-complete">
                      <div className="big">Giro {clav.round} completato! 🎉</div>
                      <p className="hint" style={{ margin: '6px 0 14px' }}>Tutti gli studenti sono passati alla lavagna.</p>
                      <button className="btn" onClick={startNextRound} style={{ width: '100%' }}>
                        Inizia giro {clav.round + 1}
                      </button>
                    </div>
                  )}

                  {/* Studente corrente da valutare */}
                  {!roundComplete && currentStudent && (
                    <div className="lav-current">
                      <div className="lav-current-label">Alla lavagna</div>
                      <div className="lav-avatar-wrap">
                        <AvatarFull uid={currentStudent.uid} size={116} />
                      </div>
                      <div className="lav-current-id">{currentNum}</div>

                      {!showOutcomes && (
                        <>
                          <div className="lav-precheck">
                            <button className="btn" onClick={() => setShowOutcomes(true)}>
                              Esito
                            </button>
                            <button className="btn lav-absent-btn" onClick={markAbsent}>
                              Assente
                            </button>
                          </div>
                          <button
                            className="lav-cancel"
                            onClick={() => setCurrentId(null)}
                          >
                            ← scegli un altro
                          </button>
                        </>
                      )}

                      {showOutcomes && (
                        <div className="lav-outcomes">
                          <button className="lav-out-btn plus" onClick={() => recordOutcome('plus')}>
                            <span className="lav-out-big">+</span>
                            <span className="lav-out-sub">Bene</span>
                          </button>
                          <button className="lav-out-btn mid" onClick={() => recordOutcome('mid')}>
                            <span className="lav-out-big">~</span>
                            <span className="lav-out-sub">Così così</span>
                          </button>
                          <button className="lav-out-btn minus" onClick={() => recordOutcome('minus')}>
                            <span className="lav-out-big">–</span>
                            <span className="lav-out-sub">Male</span>
                          </button>
                          <button className="lav-out-btn refused" onClick={() => recordOutcome('refused')}>
                            <span className="lav-out-big">✕</span>
                            <span className="lav-out-sub">Rifiuto</span>
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {/* Pesca a caso + lista di chi manca */}
                  {!roundComplete && !currentStudent && (
                    <>
                      <button className="btn" onClick={pickRandom} style={{ width: '100%', marginBottom: '6px' }}>
                        🎯 Pesca a caso ({pending.length})
                      </button>

                      <div className="lav-section-label">Oppure scegli tu — mancano {pending.length}</div>
                      <div className="lav-pending-grid">
                        {pending.map(s => {
                          const num = cls.students.findIndex(x => x.uid === s.uid) + 1;
                          return (
                            <div 
                              key={s.uid}
                              className="lav-pending-pill"
                              onClick={() => selectStudent(s.uid)}
                            >
                              <Avatar uid={s.uid} size={20} />
                              {num}
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}

                  {/* Chi ha già fatto questo giro */}
                  {done.length > 0 && (
                    <>
                      <div className="lav-section-label">Già passati (giro {clav.round})</div>
                      {done.map(uid => {
                        const st = cls.students.find(s => s.uid === uid);
                        const turn = lastTurnThisRound(uid);
                        if (!st || !turn) return null;
                        const num = cls.students.findIndex(s => s.uid === uid) + 1;
                        return (
                          <div key={uid} className="lav-done-row">
                            <Avatar uid={uid} size={24} />
                            <span className="lav-done-id">{num}</span>
                            <span className={'out-chip ' + turn.outcome}>
                              {OUTCOME_GLYPH[turn.outcome]} {OUTCOME_LABEL[turn.outcome]}
                            </span>
                            <span className="lav-done-date">{fmtDate(turn.date)}</span>
                          </div>
                        );
                      })}
                    </>
                  )}

                  {/* Storico completo + reset */}
                  <button 
                    className="reg-storico-btn"
                    onClick={() => setShowHist(!showHist)}
                    style={{ marginTop: '18px' }}
                  >
                    {showHist ? '▲ Nascondi storico completo' : '▼ Storico completo (tutti i giri)'}
                  </button>

                  {showHist && (
                    <div style={{ marginTop: '10px' }}>
                      {cls.students.map((s, idx) => {
                        const turns = (clav.turns && clav.turns[s.uid]) || [];
                        return (
                          <div key={s.uid} className="lav-hist-row">
                            <Avatar uid={s.uid} size={22} />
                            <span className="lav-hist-id">{idx + 1}</span>
                            <div className="lav-hist-marks">
                              {turns.length === 0
                                ? <span className="hint" style={{ margin: 0 }}>mai</span>
                                : turns.map((t, i) => (
                                    <span key={i} className={'hist-mark ' + t.outcome} title={fmtDate(t.date)}>
                                      {OUTCOME_GLYPH[t.outcome]}
                                    </span>
                                  ))}
                            </div>
                            <span className="lav-hist-count">{turns.length} turni</span>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  <button
                    className="btn ghost"
                    onClick={() => exportLavagnaPDF(cls, clav)}
                    style={{ width: '100%', marginTop: '16px' }}
                  >
                    ↓ Esporta lavagna in PDF
                  </button>

                  <button className="btn ghost" onClick={resetLavagna} style={{ width: '100%', marginTop: '10px' }}>
                    Azzera percorso lavagna
                  </button>
                </>
              )}
            </>
          )}
        </>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<App />);
  </script>
</body>
</html>
